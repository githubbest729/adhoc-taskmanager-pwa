<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline · AdHoc TaskManager</title>
  <meta name="theme-color" content="#0f172a">
  <meta name="color-scheme" content="dark light">
  <style>
    :root { --bg:#0b0f19; --surface:#111827; --border:#2b3752; --text:#f1f5f9; --dim:#a9b6cc; --accent:#f59e0b; --ink:#1a1100; --ok:#4ade80; --focus:#7dd3fc; }
    @media (prefers-color-scheme: light) {
      :root { --bg:#f1f5f9; --surface:#fff; --border:#cbd5e1; --text:#0f172a; --dim:#475569; --ok:#166534; --focus:#1d4ed8; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      background: var(--bg); color: var(--text);
      font: 400 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    main { width: min(100%, 28rem); text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 2rem 1.5rem; }
    .logo { width: 88px; height: 88px; margin: 0 auto 1rem; display: block; }
    h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
    p { color: var(--dim); margin: 0 0 1rem; }
    .status { display: inline-flex; align-items: center; gap: .5rem; padding: .25rem .875rem; border-radius: 999px; border: 1px solid var(--border); font-weight: 600; font-size: .9375rem; margin-bottom: 1.25rem; }
    .dot { width: .625rem; height: .625rem; border-radius: 50%; background: #f87171; }
    .status[data-online="true"] .dot { background: var(--ok); }
    .actions { display: grid; gap: .75rem; }
    .btn {
      min-height: 3rem; padding: 0 1.25rem; border-radius: 12px; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center; border: 2px solid var(--accent);
      background: var(--accent); color: var(--ink); touch-action: manipulation;
    }
    .btn.secondary { background: transparent; color: var(--text); border-color: var(--border); }
    .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .btn[disabled] { opacity: .6; cursor: progress; }
    small { color: var(--dim); display: block; margin-top: 1rem; }
  </style>
</head>
<body>
  <main>
    <svg class="logo" viewBox="0 0 512 512" role="img" aria-label="AdHoc TaskManager logo">
      <rect width="512" height="512" rx="108" fill="#0f172a"/>
      <path d="M128 300 L172 196 H340 L384 300 V368 A20 20 0 0 1 364 388 H148 A20 20 0 0 1 128 368 Z" fill="none" stroke="#f59e0b" stroke-width="26" stroke-linejoin="round"/>
      <path d="M128 300 H220 A36 36 0 0 0 292 300 H384" fill="none" stroke="#f59e0b" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M286 72 L190 214 H248 L226 310 L338 160 H276 Z" fill="#fbbf24" stroke="#0f172a" stroke-width="14" stroke-linejoin="round"/>
    </svg>
    <h1>You're offline</h1>
    <p>This page couldn't be loaded from the network. Your saved tasks live on this device and are safe.</p>

    <div class="status" id="status" data-online="false" role="status"><span class="dot" aria-hidden="true"></span><span id="status-text">No connection</span></div>

    <div class="actions">
      <button class="btn" id="retry" type="button">Retry connection</button>
      <a class="btn secondary" href="./">Open app (works offline)</a>
    </div>
    <small>We'll reconnect automatically when the network returns.</small>
  </main>

  <script>
    (function () {
      var statusEl = document.getElementById('status');
      var textEl = document.getElementById('status-text');
      var retry = document.getElementById('retry');

      function set(online, msg) {
        statusEl.dataset.online = String(online);
        textEl.textContent = msg;
      }

      // navigator.onLine can lie, so confirm with a real request that bypasses the service worker cache.
      function probe() {
        return fetch('./index.html?__probe=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok; })
          .catch(function () { return false; });
      }

      function check(manual) {
        if (manual) { retry.disabled = true; set(false, 'Checking…'); }
        return probe().then(function (ok) {
          retry.disabled = false;
          if (ok) {
            set(true, 'Back online — reconnecting…');
            setTimeout(function () { location.replace('./'); }, 600);
          } else {
            set(false, 'No connection');
          }
          return ok;
        });
      }

      retry.addEventListener('click', function () { check(true); });
      window.addEventListener('online', function () { check(false); });
      window.addEventListener('offline', function () { set(false, 'No connection'); });
      setInterval(function () { if (!document.hidden) check(false); }, 6000);
      if (navigator.onLine) check(false);
    })();
  </script>
</body>
</html>
